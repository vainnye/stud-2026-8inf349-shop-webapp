[project]
name = "shop_webapp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "peewee>=4.0.0",
    "pytest>=9.0.2",
    "pytest-flask>=1.3.0",
    "types-peewee>=4.0.0.20260223",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_webapp"]
